
name: QR Code Generator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Build Docker image
        run: docker build -t qr-code-generator-app .

      - name: Run QR Code Generator
        run: |
          docker run --name qr-generator qr-code-generator-app
          docker logs qr-generator

      - name: Verify QR code generation
        run: |
          docker cp qr-generator:/app/qr_codes/. ./generated_qr_codes/
          test -n "$(find ./generated_qr_codes -name '*.png' -print -quit)"
